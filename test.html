<!DOCTYPE html>

<html>
<head>
  <meta charset="utf-8">
  <title>Test</title>
</head>
<body>
<noscript>JavaScript demos are pretty boring if you've disabled JavaScript.</noscript>
<script type="module">
  import { Clock } from "./build/clock.js";
  let html = '<h1>Interval Period Test</h1><ul>';
  var ms = ((((((10 * 24) + 5) * 60) + 15) * 60) + 30) * 1000, interval;
  for (var periods = 5; periods >= 0; periods--) {
    interval = new Clock.Interval(ms, periods);
    html += `<li>${periods}: ${interval.toString()}</li>`;
  }
  interval = new Clock.Interval(ms, true);
  html += `<li>true: ${interval.toString()}</li>`;
  interval = new Clock.Interval(ms, false);
  html += `<li>false: ${interval.toString()}</li>`;
  html += '</ul>';
  const div = document.createElement('div');
  div.innerHTML = html;
  document.body.appendChild(div);
</script>
</body>
</html>
